<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="favicon.png" rel="shortcut icon" type="image/x-icon">
<title>Bulk Domain Detector</title>

<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #111827;
  --border: #e5e7eb;
  --accent: #2563eb;
  --hover: rgba(37,99,235,.06);
}
body.dark {
  --bg: #0f172a;
  --card: #020617;
  --text: #e5e7eb;
  --border: #1e293b;
  --accent: #60a5fa;
  --hover: rgba(96,165,250,.12);
}
body {
  margin: 0;
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background: var(--bg);
  color: var(--text);
}
.container {
  max-width: 1400px;
  margin: 32px auto;
  padding: 0 16px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
h1 { font-size: 24px; margin: 0; }

button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
}
.btn-green { background: #16a34a; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  overflow-x: auto;
}

textarea {
  width: 100%;
  min-height: 120px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
th, td {
  padding: 10px;
  border-bottom: 1px solid var(--border);
}
tbody tr:nth-child(even) {
  background: rgba(0,0,0,.03);
}
body.dark tbody tr:nth-child(even) {
  background: rgba(255,255,255,.04);
}

.badge {
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
}
.badge-301 { background:#2563eb;color:#fff;}
.badge-200 { background:#16a34a;color:#fff;}
.badge-404 { background:#dc2626;color:#fff;}

.action-link {
  font-size: 12px;
  color: var(--accent);
  cursor: pointer;
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>Bulk Domain Detector</h1>
  <button id="themeToggle">🌙 Dark</button>
</header>

<div class="card">
  <textarea id="domains" placeholder="example.com"></textarea>
</div>

<div class="card">
  <button id="run">Run Detection</button>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Domain</th>
        <th>HTTP Result</th>
        <th>301 via</th>
        <th>Cloudflare</th>
        <th>cPanel</th>
        <th>Registrar</th>
        <th>Nameservers</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const runBtn = document.getElementById("run");
  const textarea = document.getElementById("domains");
  const tbody = document.getElementById("results");

  runBtn.onclick = async () => {

    const domains = [...new Set(
      textarea.value.split(/\s+/).map(d => d.trim()).filter(Boolean)
    )];

    tbody.innerHTML = `
      <tr>
        <td colspan="7">Checking…</td>
      </tr>
    `;

    try {
      const res = await fetch("/.netlify/functions/detect", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          domains: domains   // ← MUST be this
        })
      });

      const data = await res.json();
      tbody.innerHTML = "";

      data.forEach((r, i) => {

        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${r.domain}</td>

          <td>
            ${
              r.http_result?.startsWith("301 to")
                ? `<span class="badge badge-301">301</span> ${r.http_result}`
                : r.http_result?.startsWith("http")
                  ? `<span class="badge badge-200">200</span> ${r.http_result}`
                  : r.http_result || "-"
            }
          </td>

          <td>${r.http_via || "-"}</td>
          <td>${r.cloudflare || "-"}</td>
          
          <!-- ✅ NEW COLUMN -->
          <td>
            ${
              r.whm_server && r.whm_server !== "-"
                ? `${r.whm_server}${r.whm_user && r.whm_user !== "-" ? ` (${r.whm_user})` : ""}`
                : "-"
            }
          </td>
          
          <td>${r.registrar || "-"}</td>

          <td>
            ${
              r.nameservers && r.nameservers !== "-"
                ? r.nameservers.split(",").map(ns => `<div>${ns.trim()}</div>`).join("")
                : "-"
            }
          </td>
        `;

        tbody.appendChild(tr);
      });

    } catch (err) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7">Error loading data</td>
        </tr>
      `;
    }
  };

});
</script>

</body>
</html>
