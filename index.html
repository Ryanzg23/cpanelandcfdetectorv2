<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="favicon.png" rel="shortcut icon" type="image/x-icon">
<title>Bulk Domain Detector</title>

<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #111827;
  --border: #e5e7eb;
  --accent: #2563eb;
  --hover: rgba(37,99,235,.06);
}

body.dark {
  --bg: #0f172a;
  --card: #020617;
  --text: #e5e7eb;
  --border: #1e293b;
  --accent: #60a5fa;
  --hover: rgba(96,165,250,.12);
}

body {
  margin: 0;
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 1400px;
  margin: 32px auto;
  padding: 0 16px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

h1 {
  font-size: 24px;
  margin: 0;
}

button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color .2s ease, filter .2s ease, transform .05s ease;
}

button:hover:not(:disabled) {
  filter: brightness(.95);
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

button:active:not(:disabled) {
  transform: translateY(1px);
}

/* Green action button */
.btn-green {
  background: #16a34a; /* green */
  color: #ffffff;
}

.btn-green:hover:not(:disabled) {
  filter: brightness(0.92);
}


.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

/* Prevent textarea overflow */
textarea {
  box-sizing: border-box;
  max-width: 100%;
}

/* Prevent table overflow */
table {
  table-layout: auto;
  width: 100%;
}

/* Force long URLs to wrap */
td {
  word-break: break-word;
  overflow-wrap: anywhere;
}

/* Safety for cards */
.card {
  overflow-x: auto;
}


textarea {
  width: 100%;
  min-height: 120px;
  resize: vertical;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  font-family: inherit;
  background: var(--bg);
  color: var(--text);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

th {
  text-align: left;
  font-weight: 600;
  color: #64748b;
}

tbody tr:nth-child(even) {
  background: rgba(0,0,0,.03);
}
body.dark tbody tr:nth-child(even) {
  background: rgba(255,255,255,.04);
}

tbody tr:hover {
  background: var(--hover);
}

/* Column sizing */
th.cloudflare-col,
td.cloudflare-col {
  min-width: 195px;
}

th.http-col,
td.http-col {
  min-width: 300px;
}

th.via-col,
td.via-col {
  min-width: 95px;
}

th.ns-col,
td.ns-col {
  min-width: 190px;
}

.action-link {
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  cursor: pointer;
}
.action-link:hover {
  text-decoration: underline;
}

/* Progress bar */
.progress-wrap {
  display: inline-flex;
  align-items: center;
  width: 180px;
  height: 8px;
  background: var(--border);
  border-radius: 999px;
  overflow: hidden;
  margin-left: 12px;
  opacity: 0;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width .3s ease;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 1000;
}

.modal-content {
  background: var(--card);
  color: var(--text);
  max-width: 640px;
  margin: 10vh auto;
  border-radius: 12px;
  overflow: hidden;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}

.modal-body {
  padding: 16px;
  font-size: 13px;
  line-height: 1.6;
}

.modal-header button {
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
  color: var(--text);
}

  /* Status badges */
.badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
}

.badge-301 {
  background: #2563eb; /* blue */
  color: #ffffff;
}
.badge-301-modal{ cursor: pointer; }

.badge-200 {
  background: #16a34a; /* green */
  color: #ffffff;
}

.badge-404 {
  background: #dc2626; /* red */
  color: #ffffff;
}

/* Trail table inside modal */
.trail-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.trail-table td {
  padding: 6px 0;
  vertical-align: middle;
}

.trail-url {
  color: var(--accent);
  text-decoration: none;
  word-break: break-all;
}

.trail-status {
  margin-left: 8px;
}
/* Header tool links */
.tool-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-radius: 8px;
  color: #ffffff;
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: filter .2s ease, transform .05s ease;
}

.tool-link:hover {
  filter: brightness(.92);
}

.tool-link:active {
  transform: translateY(1px);
}

/* Tool colors */
.tool-amp {
  background: #455a64;
}

.tool-robots {
  background: #0080A0;
}

.tool-seo {
  background: #2563eb;
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>Bulk Domain Detector</h1>
  <button id="themeToggle">🌙 Dark</button>
</header>

<div class="card">
  <textarea id="domains" placeholder="example.com"></textarea>
</div>

<div class="card">
  <div id="progressWrap" style="display:none; margin-bottom:10px;">
    <div style="height:10px; background:#e5e7eb; border-radius:6px; overflow:hidden;">
      <div id="progressBar" style="height:100%; width:0%; background:#16a34a;"></div>
    </div>
    <div id="progressText" style="font-size:12px; margin-top:4px;">0%</div>
  </div>
  <button id="run">Run Detection</button>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>Domain</th>
        <th>HTTP Result</th>
        <th>301 via</th>
        <th>Cloudflare</th>
        <th>cPanel</th>
        <th>Registrar</th>
        <th>Nameservers</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const runBtn = document.getElementById("run");
  const textarea = document.getElementById("domains");
  const tbody = document.getElementById("results");

  runBtn.onclick = async () => {
  
    const domains = [...new Set(
      textarea.value.split(/\s+/).map(d => d.trim()).filter(Boolean)
    )];
  
    const progressWrap = document.getElementById("progressWrap");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
  
    progressWrap.style.display = "block";
    progressBar.style.width = "0%";
    progressText.textContent = "0%";
  
    tbody.innerHTML = "";
  
    const total = domains.length;
    let completed = 0;
  
    try {
      const res = await fetch("/.netlify/functions/detect", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ domains })
      });
  
      const data = await res.json();
  
      data.forEach((r) => {
  
        completed++;
        const percent = Math.round((completed / total) * 100);
  
        progressBar.style.width = percent + "%";
        progressText.textContent = percent + "%";
  
        const tr = document.createElement("tr");
  
        tr.innerHTML = `
          <td>${r.domain}</td>
  
          <td>
            ${
              r.http_result?.startsWith("301 to")
                ? `<span class="badge badge-301">301</span> ${r.http_result}`
                : r.http_result?.startsWith("http")
                  ? `<span class="badge badge-200">200</span> ${r.http_result}`
                  : r.http_result || "-"
            }
          </td>
  
          <td>${r.http_via || "-"}</td>
          <td>${r.cloudflare || "-"}</td>
  
          <td>
            ${
              r.whm_server && r.whm_server !== "-"
                ? `${r.whm_server}${r.whm_user && r.whm_user !== "-" ? ` (${r.whm_user})` : ""}`
                : "-"
            }
          </td>
  
          <td>${r.registrar || "-"}</td>
  
          <td>
            ${
              r.nameservers && r.nameservers !== "-"
                ? r.nameservers.split(",").map(ns => `<div>${ns.trim()}</div>`).join("")
                : "-"
            }
          </td>
        `;
  
        tbody.appendChild(tr);
      });
  
    } catch (err) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7">Error loading data</td>
        </tr>
      `;
    }
  
  };

});
</script>

</body>
</html>
